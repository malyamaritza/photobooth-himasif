<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Download Photostrip — CREANOVA</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;800&family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f0ff;--card:linear-gradient(145deg,#fff,#f0e8ff);--text:#2a1f4d;--dim:#5f4f8a;--accent:#7c3aed;--sh:rgba(167,139,250,.35);--hi:rgba(255,255,255,.95)}
@media (prefers-color-scheme:dark){:root{--bg:#1a1430;--card:linear-gradient(145deg,#2e2450,#251d42);--text:#fff;--dim:#c3badf;--accent:#b79bff;--sh:rgba(0,0,0,.5);--hi:rgba(255,255,255,.12)}}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Space Grotesk',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:100%;max-width:420px;background:var(--card);border-radius:32px;padding:28px 22px;text-align:center;box-shadow:inset 3px 3px 6px var(--hi),12px 12px 30px var(--sh)}
.brand{font-family:'Playfair Display',serif;font-style:italic;font-size:2rem;color:var(--accent);margin-bottom:4px}
.sub{font-size:.65rem;letter-spacing:4px;text-transform:uppercase;color:var(--dim);font-weight:700;margin-bottom:16px}
.team{font-weight:800;font-size:1.15rem;margin-bottom:16px;word-break:break-word}
.imgwrap{min-height:120px;display:flex;align-items:center;justify-content:center;margin-bottom:18px}
img{width:100%;height:auto;border-radius:16px;box-shadow:0 10px 26px var(--sh);display:block}
.btn{display:block;width:100%;padding:16px;border:none;border-radius:999px;background:linear-gradient(145deg,#8b5cf6,#6d28d9);color:#fff;font-family:inherit;font-weight:800;font-size:.9rem;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;text-shadow:0 2px 4px rgba(0,0,0,.35);margin-bottom:12px;text-decoration:none}
.btn.ghost{background:transparent;color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent);text-shadow:none}
.btn[disabled]{opacity:.6}
.msg{font-size:.8rem;color:var(--dim);line-height:1.6;margin-top:6px;font-weight:500}
.err{color:#e11d48;font-weight:700}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="card">
  <div class="brand">Creanova</div>
  <div class="sub">HIMASIF SATU UNIVERSITY</div>
  <div class="team" id="team"></div>
  <div class="imgwrap"><img id="photo" alt="Photostrip"></div>
  <button class="btn" id="dl">⬇️ Download</button>
  <button class="btn ghost hidden" id="share">📲 Simpan ke Galeri / Bagikan</button>
  <p class="msg" id="msg">Terima kasih sudah mampir! ✨</p>
</div>
<script>
(function(){
  const q = new URLSearchParams(location.search);
  const url = q.get('u') || '';
  const team = (q.get('n') || '').slice(0, 40);
  const $ = id => document.getElementById(id);
  const msg = (t, err) => { $('msg').textContent = t; $('msg').className = 'msg' + (err ? ' err' : ''); };
  let okUrl = false;
  try { const u = new URL(url); okUrl = u.protocol === 'https:'; } catch(e) {}
  $('team').textContent = team;
  if (!okUrl) { $('dl').classList.add('hidden'); $('photo').classList.add('hidden'); msg('Link foto tidak valid.', true); return; }

  const isCloudinary = /res\.cloudinary\.com/.test(url);
  const isTmp = /tmpfiles\.org/.test(url);
  const ext = (url.split('?')[0].match(/\.(png|jpe?g)$/i) || [,'png'])[1].toLowerCase().replace('jpeg','jpg');
  const fname = 'creanova-' + (team.replace(/[^a-z0-9]+/gi,'-').toLowerCase() || 'photostrip') + '.' + ext;
  $('photo').src = url;
  $('photo').onerror = () => msg('Foto tidak dapat dimuat (mungkin sudah kedaluwarsa).', true);
  if (isTmp) msg('Foto ini tersedia sekitar 1 jam, segera simpan ya! ⏳');

  let blobCache = null;
  async function getBlob(){
    if (blobCache) return blobCache;
    const r = await fetch(url, { mode: 'cors' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    blobCache = await r.blob();
    return blobCache;
  }
  function saveBlob(b){
    const a = document.createElement('a');
    a.href = URL.createObjectURL(b); a.download = fname;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  }

  $('dl').addEventListener('click', async () => {
    const btn = $('dl'); btn.disabled = true; btn.textContent = '⏳ Menyiapkan...';
    try {
      saveBlob(await getBlob());
      msg('Download dimulai ✅ Cek folder Unduhan / Galeri kamu.');
    } catch(e) {
      if (isCloudinary) { location.href = url.replace('/upload/', '/upload/fl_attachment/'); }
      else { msg('Tekan & tahan foto di atas, lalu pilih "Simpan Gambar".', true); }
    }
    btn.disabled = false; btn.textContent = '⬇️ Download';
  });

  if (navigator.canShare && navigator.share) {
    getBlob().then(b => {
      const f = new File([b], fname, { type: b.type || 'image/png' });
      if (navigator.canShare({ files: [f] })) {
        $('share').classList.remove('hidden');
        $('share').addEventListener('click', () => navigator.share({ files: [f], title: 'Photostrip Creanova' }).catch(()=>{}));
      }
    }).catch(()=>{});
  }
})();
</script>
</body>
</html>
